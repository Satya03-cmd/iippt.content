name: Publish posters
# Runs at the posting slots (IST): 00:05, 06:30, 07:00, 07:30, 08:00, 09:00, 11:00 (catch-up), 17:30.
# Posts approved posters whose date is today and whose time has come.
on:
  schedule:
    - cron: '35 18 * * *'
    - cron: '0 1 * * *'
    - cron: '30 1 * * *'
    - cron: '0 2 * * *'
    - cron: '30 2 * * *'
    - cron: '30 3 * * *'
    - cron: '30 5 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: poster-repo
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata
  GH_TOKEN: ${{ github.token }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Post to Facebook + Instagram
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        run: node poster.js publish --emit posted.txt

      - name: Commit and close issues
        if: always()
        run: |
          git config user.name "poster-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- approved posted
          git diff --cached --quiet || git commit -m "Posted"
          git pull --rebase
          git push
          [ -f posted.txt ] || exit 0
          while read -r id; do
            [ -z "$id" ] && continue
            n=$(gh issue list --state open --search "[$id] in:title" --json number,title \
                 --jq ".[] | select(.title | endswith(\"[$id]\")) | .number" | head -n 1)
            [ -n "$n" ] && gh issue close "$n" --comment "🎉 Posted to Facebook and Instagram."
          done < posted.txt
